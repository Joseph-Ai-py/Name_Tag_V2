[project]
name = "name-tag-backend"
version = "0.1.0"
description = "NAME TAG AI Brand Workspace Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "argon2-cffi",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]